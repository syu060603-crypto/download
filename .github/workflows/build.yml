name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform / build-tools / NDK / CMake)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"

      - name: Point local.properties at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 下载官方 nodejs-mobile 安卓库（含 libnode.so + 头文件），解压到 app/libnode/
      - name: Download nodejs-mobile android libs (v18.20.4)
        run: |
          API="https://api.github.com/repos/nodejs-mobile/nodejs-mobile/releases/tags/v18.20.4"
          ASSET=$(curl -s "$API" | grep -oE 'https://[^"]*android[^"]*\.zip' | head -1)
          echo "asset=$ASSET"
          if [ -z "$ASSET" ]; then echo "未找到 android 资源，请检查版本"; exit 1; fi
          curl -L -o nm.zip "$ASSET"
          mkdir -p /tmp/nm app/libnode
          unzip -o nm.zip -d /tmp/nm
          # zip 根目录可能是 bin/ 和 include/，也可能套了一层文件夹，统一拍平到 app/libnode
          SRC=$(find /tmp/nm -maxdepth 3 -type d -name bin | head -1)
          if [ -n "$SRC" ]; then
            cp -r "$SRC/.."/* app/libnode/
          fi
          echo "--- app/libnode 结构 ---"
          find app/libnode -maxdepth 3 -type f | head -40

      # 探测 nodejs-mobile 实际提供的 ABI，写进 gradle.properties 的 xckcdyAbiFilters，
      # 让 AGP 只构建这些 ABI（避免某个 ABI 缺 libnode.so 而构建失败）。
      - name: Detect available node ABIs and pin abiFilters
        run: |
          ABIS=$(ls app/libnode/bin 2>/dev/null | grep -E '^(arm64-v8a|armeabi-v7a|x86_64|x86)$' | paste -sd, -)
          echo "detected node ABIs: $ABIS"
          if [ -n "$ABIS" ]; then
            echo "xckcdyAbiFilters=$ABIS" >> gradle.properties
          fi
          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Set up Gradle 8.9
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -o gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 如需「正式签名版」，取消下面这段注释并配置仓库 Secrets 后改用 assembleRelease
      # - name: Build release APK
      #   run: gradle assembleRelease --no-daemon
      # - name: Upload release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-apk
      #     path: app/build/outputs/apk/release/app-release.apk
