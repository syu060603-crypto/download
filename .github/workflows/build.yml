name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 运行机已预装 Android SDK，无需 setup-android（该 action 已过时，
      # 会尝试安装已不存在的 'tools' 包而失败）。直接用预装 SDK 的 sdkmanager 装所需组件。
      - name: Install SDK packages (platform / build-tools / NDK / CMake)
        run: |
          SDK="/usr/local/lib/android/sdk"
          [ -n "$ANDROID_HOME" ] && SDK="$ANDROID_HOME"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager = $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then echo "未找到 sdkmanager，当前 SDK=$SDK"; exit 1; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"

      - name: Point local.properties at the SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          [ -n "$ANDROID_HOME" ] && SDK="$ANDROID_HOME"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      # 下载官方 nodejs-mobile 安卓库（含 libnode.so + 头文件）。
      # 注意：zip 内部目录结构会随版本变化（可能是 bin/<abi>/ 或 lib/<abi>/，头文件层级也不同），
      # 这里**不假设**其结构，而是解压后用 find 真实定位 libnode.so 与 node.h，再统一重排到
      # app/libnode/lib/<abi>/libnode.so 与 app/libnode/include/node/，供 CMake 与 AGP 引用。
      - name: Download nodejs-mobile android libs (v18.20.4)
        run: |
          API="https://api.github.com/repos/nodejs-mobile/nodejs-mobile/releases/tags/v18.20.4"
          ASSET=$(curl -s "$API" | grep -oE 'https://[^"]*android[^"]*\.zip' | head -1)
          echo "asset=$ASSET"
          if [ -z "$ASSET" ]; then echo "未找到 android 资源，请检查版本"; exit 1; fi
          curl -L -o nm.zip "$ASSET"
          rm -rf /tmp/nm app/libnode
          mkdir -p /tmp/nm app/libnode/lib app/libnode/include/node
          unzip -o nm.zip -d /tmp/nm

          # 1) 定位所有 libnode.so，按 ABI 归类到 app/libnode/lib/<abi>/
          found=0
          for so in $(find /tmp/nm -type f -name 'libnode.so'); do
            abi=$(echo "$so" | grep -oE '(arm64-v8a|armeabi-v7a|x86_64|x86)' | head -1)
            if [ -n "$abi" ]; then
              mkdir -p "app/libnode/lib/$abi"
              cp -f "$so" "app/libnode/lib/$abi/libnode.so"
              echo "copied: $so -> app/libnode/lib/$abi/libnode.so"
              found=1
            else
              echo "WARN: 无法确定 ABI，跳过: $so"
            fi
          done
          if [ "$found" -eq 0 ]; then echo "ERROR: 未在 zip 中找到任何 libnode.so"; exit 1; fi

          # 2) 定位头文件目录（含 node.h），整目录拷到 app/libnode/include/node/
          nd=$(find /tmp/nm -type f -name 'node.h' | head -1)
          if [ -n "$nd" ]; then
            nd_dir=$(dirname "$nd")
            cp -rf "$nd_dir/." "app/libnode/include/node/"
            echo "headers: $nd_dir -> app/libnode/include/node/"
          else
            echo "WARN: 未找到 node.h，编译可能失败"
          fi

          echo "--- app/libnode 结构 ---"
          find app/libnode -maxdepth 3 -type f | head -40

      # 探测 nodejs-mobile 实际提供的 ABI（已从 zip 重排到 app/libnode/lib/），
      # 写进 gradle.properties 的 xckcdyAbiFilters，让 AGP 只构建这些 ABI。
      - name: Detect available node ABIs and pin abiFilters
        run: |
          ABIS=$(ls app/libnode/lib 2>/dev/null | grep -E '^(arm64-v8a|armeabi-v7a|x86_64|x86)$' | paste -sd, -)
          echo "detected node ABIs: $ABIS"
          if [ -n "$ABIS" ]; then
            echo "xckcdyAbiFilters=$ABIS" >> gradle.properties
          fi
          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Set up Gradle 8.9
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -o gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 如需「正式签名版」，取消下面这段注释并配置仓库 Secrets 后改用 assembleRelease
      # - name: Build release APK
      #   run: gradle assembleRelease --no-daemon
      # - name: Upload release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-apk
      #     path: app/build/outputs/apk/release/app-release.apk
