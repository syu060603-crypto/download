apply plugin: 'com.android.application'

android {
    namespace 'com.xckcdy.xckcdy'
    compileSdk 34

    defaultConfig {
        applicationId "com.xckcdy.xckcdy"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndkVersion "26.1.10909125"

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试用，不影响功能
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅用系统 WebView，无第三方依赖
}
