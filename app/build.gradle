apply plugin: 'com.android.application'

android {
    namespace 'com.xckcdy.xckcdy'
    compileSdk 34

    defaultConfig {
        applicationId "com.xckcdy.xckcdy"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndkVersion "26.1.10909125"

        // 只构建 nodejs-mobile 实际提供的 ABI（由 CI 探测后写入 gradle.properties 的
        // xckcdyAbiFilters；此处给出兜底默认值，避免某个 ABI 缺 libnode.so 导致构建失败）。
        ndk {
            def abiProp = project.findProperty('xckcdyAbiFilters')?.toString()?.trim()
            if (abiProp) {
                abiFilters = abiProp.split(',').collect { it.trim() }.findAll { it }
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试用，不影响功能
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅用系统 WebView，无第三方依赖
}
