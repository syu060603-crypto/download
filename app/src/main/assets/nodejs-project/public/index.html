<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星辰影视 · 批量下载器</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e3e6ea; --text:#1b1f24; --muted:#6b7280;
  --accent:#2563eb; --accent-w:#eff4ff; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
header.top{
  background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff;
  padding:18px 14px 16px; margin:-16px -14px 18px; border-radius:0 0 16px 16px;
}
header.top .inner{max-width:1180px;margin:0 auto}
header.top h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
header.top p{margin:6px 0 0;font-size:12.5px;opacity:.85;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;font-weight:500;color:var(--muted);background:#f1f3f5;padding:2px 7px;border-radius:20px}
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=number],select{
  font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;outline:none;min-width:0;
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.searchbar input[type=text]{flex:1 1 240px}
.btn{
  font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:9px;padding:9px 14px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c9ced4;background:#fafbfc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{color:var(--err);border-color:#f3c6c6}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.grid-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px}
.res{
  background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
  transition:.15s; display:flex;flex-direction:column;
}
.res:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 14px rgba(15,23,42,.09)}
.res .ph{aspect-ratio:2/3;background:#e9ecef;display:flex;align-items:center;justify-content:center;overflow:hidden}
.res .ph img{width:100%;height:100%;object-fit:cover;display:block}
.res .ph span{font-size:26px;opacity:.35}
.res .meta{padding:7px 8px 8px}
.res .t{font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.res .n{font-size:11px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tab{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;
  border-radius:20px;padding:5px 13px;color:var(--muted)}
.tab.on{background:var(--accent-w);border-color:var(--accent);color:var(--accent);font-weight:600}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px;
  padding-bottom:10px;border-bottom:1px dashed var(--line)}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.toolbar label{font-size:12.5px;color:var(--muted)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;max-height:340px;overflow:auto;padding:2px}
.ep{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 4px;text-align:center;
  cursor:pointer;font-size:12.5px;transition:.12s;user-select:none;position:relative;
}
.ep:hover{border-color:#b6bcc4}
.ep.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ep.ok::after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.ep.on.ok::after{background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.selcount{font-size:13px;color:var(--accent);font-weight:600}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}
.monospace{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all}
.m3u8box{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfd;padding:10px;max-height:210px;overflow:auto}
.m3u8box .row{padding:5px 0;border-bottom:1px solid #eef0f2;font-size:12px}
.m3u8box .row:last-child{border-bottom:none}
.m3u8box .row b{color:var(--text);margin-right:6px}
.job{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.job .jh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.job .jt{font-weight:650;font-size:14px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#f1f3f5;color:var(--muted)}
.pill.run{background:#e0edff;color:var(--accent)}
.pill.done{background:#dcfce7;color:var(--ok)}
.pill.err{background:#fee2e2;color:var(--err)}
.frow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;flex-wrap:wrap}
.frow .fn{min-width:78px;font-weight:500}
.bar{flex:1 1 130px;height:7px;background:#e9ecef;border-radius:20px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .3s}
.bar.done i{background:var(--ok)}
.bar.err i{background:var(--err)}
.frow .pc{font-size:11.5px;color:var(--muted);min-width:82px;text-align:right}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:14px 0 0;line-height:1.7}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:600px){
  .wrap{padding:12px 10px 50px}
  header.top{margin:-12px -10px 14px;padding:15px 12px 14px}
  .grid-results{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
  .eps{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:300px}
  .card{padding:13px}
  .btn{padding:8px 12px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="inner">
      <h1>星辰影视 · 批量下载器</h1>
      <p id="sub">搜索剧名 → 勾选分集 → 批量下载（电脑 / 手机浏览器通用）</p>
    </div>
  </header>

  <!-- 搜索 -->
  <section class="card">
    <h2>1 · 搜索剧集 <span class="tag" id="srcTag">xckcdy.com</span></h2>
    <div class="searchbar">
      <input type="text" id="kw" placeholder="输入剧名，如：爱你 / 凡人修仙传" autocomplete="off">
      <button class="btn primary" id="btnSearch">搜索</button>
    </div>
    <div id="searchMsg" class="hint"></div>
    <div id="results" class="grid-results" style="margin-top:12px"></div>
  </section>

  <!-- 详情 -->
  <section class="card" id="detailCard" hidden>
    <h2>2 · 选择分集 <span class="tag" id="dramaTag"></span></h2>
    <div id="dramaHead" style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
      <img id="dramaPic" alt="" style="width:62px;height:92px;object-fit:cover;border-radius:8px;background:#e9ecef;display:none">
      <div>
        <div style="font-size:17px;font-weight:650" id="dramaTitle"></div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px" id="dramaInfo"></div>
      </div>
    </div>
    <div class="tabs" id="groupTabs"></div>
    <div class="toolbar">
      <button class="btn sm" data-act="all">全选</button>
      <button class="btn sm" data-act="none">清空</button>
      <button class="btn sm" data-act="invert">反选</button>
      <div class="sep"></div>
      <label>第</label><input type="number" id="rFrom" value="1" min="1" style="width:62px">
      <label>—</label><input type="number" id="rTo" value="10" min="1" style="width:62px">
      <label>集</label>
      <button class="btn sm" data-act="range">选范围</button>
      <div class="sep"></div>
      <span class="selcount" id="selCount">已选 0 集</span>
    </div>
    <div class="eps" id="epList"></div>
    <div class="acts">
      <button class="btn primary" id="btnDownload">↓ 批量下载到电脑</button>
      <button class="btn" id="btnResolve">解析地址</button>
      <button class="btn" id="btnCopy">复制 m3u8</button>
      <button class="btn" id="btnExport">导出链接</button>
    </div>
    <p class="hint">并发下载分片：<b id="ccLabel">8</b> <input type="range" id="cc" min="2" max="24" value="8" style="width:120px;vertical-align:middle"></p>
    <div id="m3u8Wrap" hidden>
      <div class="m3u8box" id="m3u8Box"></div>
    </div>
  </section>

  <!-- 任务 -->
  <section class="card" id="jobsCard" hidden>
    <h2>3 · 下载任务 <span class="tag" id="dirTag"></span></h2>
    <div id="jobs"></div>
  </section>

  <div class="foot">
    本工具仅作技术研究与离线收藏用途，请勿用于传播受版权保护的内容。<br>
    下载文件为 MPEG-TS 格式，可用 PotPlayer / VLC / IINA 直接播放。
  </div>
</div>

<script>
(function(){
'use strict';

/* 全局错误横幅：手机端没有控制台，出错时直接在页面顶部红字显示 */
function showBanner(msg){
  var b=document.getElementById('errbar');
  if(!b){
    b=document.createElement('div'); b.id='errbar';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;'+
      'font-size:13px;padding:10px 12px;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.25)';
    (document.body||document.documentElement).appendChild(b);
  }
  b.textContent='⚠ '+msg; b.style.display='block';
  setTimeout(function(){ if(b) b.style.display='none'; }, 7000);
}
window.addEventListener('error', function(e){
  showBanner('页面错误: '+(e.message||e.error||'未知')+(e.filename?(' @'+e.filename+':'+e.lineno):''));
});
window.addEventListener('unhandledrejection', function(e){
  var r=e.reason; showBanner('异步错误: '+((r&&r.message)||r||'未知'));
});

var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var state={vid:null,title:'',pic:'',groups:[],active:null,sel:{},m3u8:{},cc:8};
var info={};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtSize(n){if(!n)return '0 B';var u=['B','KB','MB','GB','TB'],i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}return n.toFixed(i?1:0)+' '+u[i];}
function key(pid,epid){return pid+'-'+epid;}
function selItems(){
  var out=[],g=curGroup(); if(!g)return out;
  g.episodes.forEach(function(ep){ if(state.sel[key(g.pid,ep.epid)]) out.push({vid:state.vid,pid:g.pid,epid:ep.epid,name:ep.name}); });
  return out;
}
function curGroup(){
  for(var i=0;i<state.groups.length;i++) if(state.groups[i].pid===state.active) return state.groups[i];
  return state.groups[0]||null;
}

/* ---------- 初始化 ---------- */
fetch('/api/info').then(function(r){return r.json()}).then(function(d){
  info=d; $('#srcTag').textContent='源站 xckcdy.com';
  $('#dirTag').textContent='保存至 '+d.downloadDir;
  var ips=d.lanIps||[];
  $('#sub').innerHTML='搜索剧名 → 勾选分集 → 批量下载'+
    (ips.length?' ｜ 手机同 WiFi 可访问 http://'+ips[0]+':'+d.port:'');
}).catch(function(){});

/* ---------- 搜索 ---------- */
function doSearch(){
  var kw=$('#kw').value.trim(); if(!kw)return;
  $('#searchMsg').innerHTML='<span class="spin"></span> 搜索中…';
  $('#results').innerHTML='';
  fetch('/api/search?kw='+encodeURIComponent(kw)).then(function(r){return r.json()}).then(function(d){
    if(d.error){$('#searchMsg').textContent=d.error;return;}
    $('#searchMsg').textContent='找到 '+d.results.length+' 个结果';
    if(!d.results.length){$('#results').innerHTML='<div class="empty">没有找到「'+esc(kw)+'」</div>';return;}
    $('#results').innerHTML=d.results.map(function(it){
      return '<div class="res" data-vid="'+esc(it.vid)+'" data-title="'+esc(it.title)+'" data-pic="'+esc(it.pic)+'">'+
        '<div class="ph">'+(it.pic?'<img src="'+esc(it.pic)+'" loading="lazy" onerror="this.parentNode.innerHTML=\'<span>🎬</span>\'">':'<span>🎬</span>')+'</div>'+
        '<div class="meta"><div class="t">'+esc(it.title)+'</div>'+
        (it.note?'<div class="n">'+esc(it.note)+'</div>':'')+'</div></div>';
    }).join('');
    $$('#results .res').forEach(function(el){ el.onclick=function(){openDetail(el.dataset.vid);}; });
  }).catch(function(e){ $('#searchMsg').textContent='搜索失败：'+e.message; });
}
$('#btnSearch').onclick=doSearch;
$('#kw').addEventListener('keydown',function(e){ if(e.key==='Enter')doSearch(); });

/* ---------- 详情 ---------- */
function openDetail(vid){
  fetch('/api/detail?vid='+encodeURIComponent(vid)).then(function(r){return r.json()}).then(function(d){
    if(d.error){alert(d.error);return;}
    state.vid=vid; state.title=d.title||('VID '+vid); state.pic=d.pic||'';
    state.groups=d.groups||[]; state.sel={}; state.m3u8={};
    state.active=state.groups.length?state.groups[0].pid:null;
    $('#detailCard').hidden=false;
    $('#dramaTitle').textContent=state.title;
    var g=state.groups[0];
    $('#dramaInfo').textContent=state.groups.length+' 条播放线路 · '+
      (g?g.episodes.length:0)+' 集（每线路）';
    if(state.pic){$('#dramaPic').src=state.pic;$('#dramaPic').style.display='';}
    else $('#dramaPic').style.display='none';
    $('#dramaTag').textContent='VID '+vid;
    $('#m3u8Wrap').hidden=true;
    renderTabs(); renderEps();
    $('#detailCard').scrollIntoView({behavior:'smooth',block:'start'});
  }).catch(function(e){alert('加载详情失败：'+e.message);});
}

function renderTabs(){
  $('#groupTabs').innerHTML=state.groups.map(function(g){
    return '<button class="tab'+(g.pid===state.active?' on':'')+'" data-pid="'+g.pid+'">'+esc(g.name)+'</button>';
  }).join('');
  $$('#groupTabs .tab').forEach(function(t){
    t.onclick=function(){ state.active=parseInt(t.dataset.pid,10); renderTabs(); renderEps(); };
  });
}
function renderEps(){
  var g=curGroup(); if(!g){$('#epList').innerHTML='<div class="empty">无分集</div>';return;}
  $('#epList').innerHTML=g.episodes.map(function(ep){
    var k=key(g.pid,ep.epid), on=!!state.sel[k], has=!!state.m3u8[k];
    return '<div class="ep'+(on?' on':'')+(has?' ok':'')+'" data-k="'+k+'">'+esc(ep.name)+'</div>';
  }).join('');
  $$('#epList .ep').forEach(function(el){
    el.onclick=function(){
      var k=el.dataset.k;
      if(state.sel[k]) delete state.sel[k]; else state.sel[k]=1;
      el.classList.toggle('on'); updCount();
    };
  });
  updCount();
}
function updCount(){
  var n=Object.keys(state.sel).length;
  $('#selCount').textContent='已选 '+n+' 集';
}

$$('.toolbar .btn').forEach(function(b){
  b.onclick=function(){
    var g=curGroup(); if(!g)return;
    var act=b.dataset.act;
    if(act==='all') g.episodes.forEach(function(e){state.sel[key(g.pid,e.epid)]=1;});
    if(act==='none') g.episodes.forEach(function(e){delete state.sel[key(g.pid,e.epid)];});
    if(act==='invert') g.episodes.forEach(function(e){
      var k=key(g.pid,e.epid);
      if(state.sel[k])delete state.sel[k];else state.sel[k]=1;});
    if(act==='range'){
      var a=parseInt($('#rFrom').value,10)||1, z=parseInt($('#rTo').value,10)||1;
      if(a>z){var t=a;a=z;z=t;}
      g.episodes.forEach(function(e){
        var no=e.epid+1;
        if(no>=a&&no<=z) state.sel[key(g.pid,e.epid)]=1;
      });
    }
    renderEps();
  };
});
$('#cc').oninput=function(){ state.cc=parseInt(this.value,10); $('#ccLabel').textContent=state.cc; };

/* ---------- 解析 ---------- */
$('#btnResolve').onclick=function(){
  var items=selItems();
  if(!items.length){alert('请先勾选要处理的分集');return;}
  var b=$(this); b.disabled=true; b.innerHTML='<span class="spin"></span> 解析中';
  fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items:items,concurrency:6})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){alert(d.error);return;}
    var ok=0;
    d.results.forEach(function(r){
      var k=key(r.pid,r.epid);
      if(r.m3u8){state.m3u8[k]=r.m3u8;ok++;}
    });
    renderEps();
    $('#m3u8Wrap').hidden=false;
    $('#m3u8Box').innerHTML=d.results.map(function(r){
      return '<div class="row"><b>'+esc(r.name)+'</b>'+
        (r.m3u8?'<span class="monospace">'+esc(r.m3u8)+'</span>'
              :'<span style="color:var(--err)">失败：'+esc(r.error)+'</span>')+'</div>';
    }).join('');
    alert('解析完成：成功 '+ok+' / '+d.results.length);
  }).catch(function(e){alert('解析失败：'+e.message);})
  .then(function(){ b.disabled=false; b.textContent='解析地址'; });
};

/* ---------- 下载 ---------- */
$('#btnDownload').onclick=function(){
  var items=selItems();
  if(!items.length){alert('请先勾选要下载的分集');return;}
  items=items.map(function(it){
    return {vid:it.vid,pid:it.pid,epid:it.epid,name:it.name,
            m3u8:state.m3u8[key(it.pid,it.epid)]||null};
  });
  if(!confirm('将下载 '+items.length+' 集到电脑，确定继续？'))return;
  var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span> 提交中';
  fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:state.title,items:items,concurrency:state.cc})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){alert(d.error);return;}
    $('#jobsCard').hidden=false;
    startPolling();
  }).catch(function(e){alert('提交失败：'+e.message);})
  .then(function(){ b.disabled=false; b.textContent=' ↓ 批量下载到电脑'; });
};

/* ---------- 复制 / 导出 ---------- */
function linksText(){
  var items=selItems(), out=[];
  items.forEach(function(it){
    var u=state.m3u8[key(it.pid,it.epid)];
    if(u) out.push('# '+it.name+'\n'+u);
  });
  return out.join('\n');
}
$('#btnCopy').onclick=function(){
  var t=linksText();
  if(!t){alert('请先「解析地址」');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){alert('已复制 '+t.split('\n').length+' 行');},
      function(){prompt('请手动复制：',t);});
  } else prompt('请手动复制：',t);
};
$('#btnExport').onclick=function(){
  var t=linksText();
  if(!t){alert('请先「解析地址」');return;}
  var blob=new Blob([t],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(state.title||'m3u8')+'.txt';
  a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- 任务轮询 ---------- */
var timer=null;
function startPolling(){ if(timer)return; pollJobs(); timer=setInterval(pollJobs,1500); }
function pollJobs(){
  fetch('/api/jobs').then(function(r){return r.json()}).then(function(d){
    var list=d.jobs||[];
    if(!list.length){ $('#jobs').innerHTML='<div class="empty">暂无下载任务</div>'; if(timer){clearInterval(timer);timer=null;} return; }
    $('#jobs').innerHTML=list.map(function(j){
      var tot=0,done=0;
      j.files.forEach(function(f){ tot+=f.total||0; done+=f.done||0; });
      var pct=tot?Math.round(done/tot*100):0;
      var cls=j.status==='done'?'done':(j.status==='cancelled'||j.status==='completed_with_errors'?'err':'run');
      var sLabel={running:'下载中',done:'已完成',cancelled:'已取消',completed_with_errors:'部分失败'}[j.status]||j.status;
      var rows=j.files.map(function(f,i){
        var fp=f.total?Math.round(f.done/f.total*100):(f.status==='done'||f.status==='skipped'?100:0);
        var fc=(f.status==='done'||f.status==='skipped')?'done':(f.status==='error'||f.status==='cancelled'?'err':'');
        var fLabel={done:'已完成',skipped:'已存在',error:'失败',cancelled:'已取消',downloading:'下载中',resolving:'解析中',pending:'排队'}[f.status]||f.status;
        var link=(f.status==='done'||f.status==='skipped')
          ? '<a class="btn sm" href="/api/file/'+j.id+'/'+i+'">保存到本机</a>' : '';
        return '<div class="frow"><span class="fn">'+esc(f.name)+'</span>'+
          '<div class="bar '+fc+'"><i style="width:'+fp+'%"></i></div>'+
          '<span class="pc">'+(f.total?(f.done+'/'+f.total):fLabel)+
          (f.bytes?' · '+fmtSize(f.bytes):'')+'</span>'+link+'</div>';
      }).join('');
      return '<div class="job"><div class="jh"><span class="jt">'+esc(j.title)+'</span>'+
        '<span class="pill '+cls+'">'+sLabel+' '+pct+'%</span>'+
        (j.status==='running'?'<button class="btn sm danger" data-cancel="'+esc(j.id)+'">取消</button>':'')+
        '</div>'+rows+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:7px">'+esc(j.dir)+'</div></div>';
    }).join('');
    $$('#jobs [data-cancel]').forEach(function(b){
      b.onclick=function(){
        if(!confirm('确定取消该下载任务？'))return;
        b.disabled=true;
        fetch('/api/job/'+encodeURIComponent(b.dataset.cancel)+'/cancel',{method:'POST'})
          .then(function(){pollJobs();});
      };
    });
    var running=list.some(function(j){return j.status==='running';});
    if(!running&&timer){clearInterval(timer);timer=null;}
  }).catch(function(){});
}
})();
</script>
</body>
</html>
