<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f6f7fb">
<meta name="format-detection" content="telephone=no">
<title>影视下载器</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f2f4f8; --line:#e6e9ef;
  --text:#101828; --text-2:#475467; --muted:#8a94a6;
  --accent:#4f46e5; --accent-2:#7c3aed; --accent-weak:#eef0ff;
  --ok:#0f9d58; --ok-weak:#e6f6ee; --warn:#e08700; --warn-weak:#fff5e5;
  --danger:#e5484d; --danger-weak:#fdecec;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.18);
  --radius:16px; --r-sm:11px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0d12; --surface:#14171f; --surface-2:#1b1f29; --line:#252a35;
    --text:#e9edf5; --text-2:#aab3c2; --muted:#7d8798;
    --accent:#7c8bff; --accent-2:#a78bfa; --accent-weak:#1c2140;
    --ok:#3ddc97; --ok-weak:#12291f; --warn:#ffb020; --warn-weak:#2a2110;
    --danger:#ff6b6b; --danger-weak:#2b1517;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.8);
  }
}
html[data-theme="light"]{ --bg:#f5f6fa; --surface:#fff; --surface-2:#f2f4f8; --line:#e6e9ef; --text:#101828; --text-2:#475467; --muted:#8a94a6; --accent:#4f46e5; --accent-2:#7c3aed; --accent-weak:#eef0ff; --ok:#0f9d58; --ok-weak:#e6f6ee; --warn:#e08700; --warn-weak:#fff5e5; --danger:#e5484d; --danger-weak:#fdecec; }
html[data-theme="dark"]{ --bg:#0b0d12; --surface:#14171f; --surface-2:#1b1f29; --line:#252a35; --text:#e9edf5; --text-2:#aab3c2; --muted:#7d8798; --accent:#7c8bff; --accent-2:#a78bfa; --accent-weak:#1c2140; --ok:#3ddc97; --ok-weak:#12291f; --warn:#ffb020; --warn-weak:#2a2110; --danger:#ff6b6b; --danger-weak:#2b1517; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(64px + var(--safe-b))}

/* ---------- 顶栏 ---------- */
header.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
header.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{
  width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px -4px var(--accent);
}
.brand b{display:block;font-size:15.5px;font-weight:650;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.dot.off{background:var(--danger)}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);flex:none;transition:.15s}
.icon-btn:active{background:var(--surface-2);transform:scale(.94)}

/* ---------- 搜索 ---------- */
.view{padding:0 16px}
.searchbar{
  display:flex;align-items:center;gap:8px;margin:6px 0 14px;padding:6px 6px 6px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  transition:border-color .18s,box-shadow .18s;
}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.searchbar svg{flex:none;color:var(--muted)}
.searchbar input{flex:1;min-width:0;border:none;outline:none;background:none;padding:8px 0;font-size:15.5px}
.searchbar input::placeholder{color:var(--muted)}
.clear{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:15px;flex:none}
.go{
  flex:none;padding:9px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:.15s;
}
.go:active{transform:scale(.96)}
.go[disabled]{opacity:.55}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2);transition:.15s}
.chip:active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}

.hint{font-size:12.5px;color:var(--muted);min-height:18px;margin:0 2px 10px;display:flex;align-items:center;gap:6px}
.hint.err{color:var(--danger)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
@media(min-width:520px){ .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:14px} }
.card{
  position:relative;border-radius:13px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  transition:transform .16s,box-shadow .16s,border-color .16s;text-align:left;
}
.card:active{transform:scale(.972)}
.card .ph{position:relative;aspect-ratio:2/3;background:var(--surface-2);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.card .ph img.loaded{opacity:1}
.card .ph .fb{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:22px}
.card .tag{
  position:absolute;left:6px;top:6px;padding:2px 6px;border-radius:6px;font-size:10.5px;font-weight:600;
  color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)
}
.card .body{padding:7px 8px 9px}
.card .t{font-size:12.8px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .s{font-size:10.8px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sk{position:relative;overflow:hidden;background:var(--surface-2)}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 70%,transparent),transparent);
  animation:sh 1.3s infinite}
@keyframes sh{100%{transform:translateX(100%)}}
.sk-card{border-radius:13px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sk-card .a{aspect-ratio:2/3}
.sk-card .b{height:12px;margin:9px 8px;border-radius:4px}
.sk-card .c{height:10px;margin:0 8px 10px;border-radius:4px;width:60%}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:34px;opacity:.5;margin-bottom:10px}
.empty b{display:block;color:var(--text-2);font-size:14.5px;font-weight:600;margin-bottom:5px}
.empty p{margin:0;font-size:13px;line-height:1.6}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:6px 12px calc(6px + var(--safe-b));gap:6px;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;
  color:var(--muted);font-size:11px;font-weight:500;position:relative;transition:.15s
}
.tabbar button.on{color:var(--accent);background:var(--accent-weak)}
.tabbar svg{width:21px;height:21px}
.badge{
  position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center
}

/* ---------- 详情弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet-mask{position:absolute;inset:0;background:rgba(8,10,16,.5);opacity:0;transition:opacity .22s;backdrop-filter:blur(2px)}
.sheet.open .sheet-mask{opacity:1}
.sheet-body{
  position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:93vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:0 -12px 40px rgba(0,0,0,.25)
}
.sheet.open .sheet-body{transform:translateY(0)}
@media(min-width:760px){ .sheet{align-items:center} .sheet-body{width:760px;border-radius:20px;margin-bottom:24px;max-height:88vh} }
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 12px;flex:1}
.sheet-head{display:flex;gap:14px;padding:18px 16px 12px;align-items:flex-start}
.sheet-head img{width:92px;height:132px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none;box-shadow:var(--shadow)}
.sheet-head .tt{flex:1;min-width:0}
.sheet-head h2{margin:2px 0 6px;font-size:19px;line-height:1.3;font-weight:700;word-break:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:2.5px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.pill.a{background:var(--accent-weak);color:var(--accent)}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.close-x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);z-index:2}
.desc{font-size:13px;color:var(--text-2);line-height:1.65;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset}
.more{font-size:12.5px;color:var(--accent);margin-bottom:14px}

.lines{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.lines::-webkit-scrollbar{display:none}
.line{flex:none;padding:7px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2);transition:.15s}
.line.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 12px}
.tb{padding:6px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.tb:active{background:var(--surface-2)}
.tb.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.range{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.range input{width:46px;padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:12.5px}
.count{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600}

.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.ep{
  position:relative;padding:9px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;text-align:center;transition:.13s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}
.ep:active{transform:scale(.95)}
.ep.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ep .d{position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.ep.on .d{background:#fff}

.sheet-foot{
  padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--surface);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap
}
.sheet-foot .sel{font-size:12.5px;color:var(--muted);flex:1;min-width:110px}
.sheet-foot .sel b{color:var(--accent);font-size:14px}
select.q{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;outline:none}
.big{
  padding:12px 22px;border-radius:12px;color:#fff;font-weight:650;font-size:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px -10px var(--accent);transition:.15s
}
.big:active{transform:scale(.97)}
.big[disabled]{opacity:.5;box-shadow:none}
.adv{width:100%;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.adv span{white-space:nowrap}
.adv .grp{display:flex;align-items:center;gap:6px;flex:1 1 130px;min-width:120px}
.adv input[type=range]{flex:1;min-width:52px;accent-color:var(--accent);height:18px}
.adv .grp.sw{flex:0 0 100%;min-width:0;justify-content:space-between}
.adv .tg{position:relative;display:inline-block;width:36px;height:21px;flex:none}
.adv .tg input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;z-index:2}
.adv .tg i{position:absolute;inset:0;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);transition:.18s}
.adv .tg i::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.18s}
.adv .tg input:checked+i{background:var(--accent);border-color:var(--accent)}
.adv .tg input:checked+i::after{transform:translateX(15px);background:#fff}

/* ---------- 任务 ---------- */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;margin:6px 0 14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;color:var(--text-2);font-weight:500;transition:.15s}
.seg button.on{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.job .jh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.job .jt{flex:1;min-width:0}
.job .jt b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .jt small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.st{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;flex:none}
.st.run{background:var(--accent-weak);color:var(--accent)}
.st.done{background:var(--ok-weak);color:var(--ok)}
.st.err{background:var(--danger-weak);color:var(--danger)}
.st.pause{background:var(--warn-weak);color:var(--warn)}
.st.idle{background:var(--surface-2);color:var(--muted)}

.prog{height:7px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;width:0}
.prog.done i{background:var(--ok)}
.prog.err i{background:var(--danger)}
.prog.pause i{background:var(--warn)}

.stat{display:flex;gap:12px;flex-wrap:wrap;font-size:11.8px;color:var(--muted);margin-bottom:10px}
.stat b{color:var(--text-2);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--text-2);background:var(--surface);transition:.15s}
.act:active{background:var(--surface-2)}
.act.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.act.dan{color:var(--danger);border-color:#f0c2c2}
html[data-theme="dark"] .act.dan{border-color:#5a2a2d}
.act[disabled]{opacity:.45}

.files{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.files.open{display:block}
.f{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px}
.f .fn{width:64px;flex:none;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .fb{flex:1;height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:40px}
.f .fb i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.f .fb i.done{background:var(--ok)}
.f .fb i.err{background:var(--danger)}
.f .fs{width:96px;flex:none;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.f .fgo{flex:none;font-size:11.5px;color:var(--accent);padding:2px 6px;border-radius:6px;background:var(--accent-weak)}
.f .ferr{color:var(--danger)}
.f .fad{flex:none;font-size:10px;line-height:1.4;padding:1px 5px;border-radius:4px;background:var(--accent-weak);color:var(--accent);font-weight:600}

/* ---------- Toast / 确认 ---------- */
#toasts{position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;padding:0 20px}
#toasts.sheet{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
.toast{
  max-width:420px;padding:10px 16px;border-radius:12px;font-size:13.5px;color:#fff;background:rgba(24,28,38,.94);
  box-shadow:0 8px 28px rgba(0,0,0,.28);animation:tin .22s ease;display:flex;gap:8px;align-items:center;line-height:1.4
}
.toast.ok{background:rgba(15,157,88,.96)}
.toast.err{background:rgba(229,72,77,.96)}
.toast.warn{background:rgba(206,132,0,.96)}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.toast.out{animation:tout .2s ease forwards}
@keyframes tout{to{opacity:0;transform:translateY(-4px)}}

.dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px}
.dialog[hidden]{display:none}
.dialog .mask{position:absolute;inset:0;background:rgba(8,10,16,.5);backdrop-filter:blur(2px)}
.dialog .box{position:relative;width:100%;max-width:340px;background:var(--surface);border-radius:18px;padding:22px 20px 16px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:tin .2s ease}
.dialog h3{margin:0 0 8px;font-size:16.5px}
.dialog p{margin:0 0 18px;font-size:13.5px;color:var(--text-2);line-height:1.6}
.dialog .row{display:flex;gap:9px}
.dialog .row button{flex:1;padding:11px;border-radius:11px;font-size:14.5px;font-weight:600;background:var(--surface-2);color:var(--text)}
.dialog .row button.ok{background:var(--accent);color:#fff}
.dialog .row button.dan{background:var(--danger);color:#fff}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .65s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="brand">
      <div class="logo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
      </div>
      <div>
        <b>影视下载器</b>
        <small id="statusText"><span class="dot off"></span>连接中…</small>
      </div>
    </div>
    <button class="icon-btn" id="btnTheme" aria-label="切换主题">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </header>

  <main>
    <section class="view" id="view-search">
      <form class="searchbar" id="searchForm" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="kw" type="search" placeholder="搜索剧名，如：爱你" enterkeyhint="search" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="clear" id="btnClear" hidden aria-label="清空">×</button>
        <button type="submit" class="go" id="btnSearch">搜索</button>
      </form>
      <div class="chips" id="chips"></div>
      <div class="hint" id="searchHint"></div>
      <div class="grid" id="results"></div>
    </section>

    <section class="view" id="view-jobs" hidden>
      <div class="seg" id="jobSeg">
        <button data-f="active" class="on">进行中</button>
        <button data-f="all">全部</button>
      </div>
      <div id="jobs"></div>
    </section>
  </main>
</div>

<nav class="tabbar">
  <button data-view="search" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    搜索
  </button>
  <button data-view="jobs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/></svg>
    下载
    <span class="badge" id="jobBadge" hidden></span>
  </button>
</nav>

<!-- 详情 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <button class="close-x" data-close aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-scroll" id="sheetScroll">
      <div class="sheet-head">
        <img id="dPic" alt="">
        <div class="tt">
          <h2 id="dTitle">加载中…</h2>
          <div class="meta" id="dMeta"></div>
        </div>
      </div>
      <p class="desc" id="dDesc" hidden></p>
      <div class="more" id="dMore" hidden>展开简介</div>
      <div class="lines" id="dLines"></div>
      <div class="toolbar">
        <button class="tb" data-act="all">全选</button>
        <button class="tb" data-act="none">清空</button>
        <button class="tb" data-act="invert">反选</button>
        <button class="tb" data-act="undone">选未下载</button>
        <div class="range">
          <input id="rFrom" type="number" inputmode="numeric" value="1" min="1" aria-label="起始集">
          <span>—</span>
          <input id="rTo" type="number" inputmode="numeric" value="10" min="1" aria-label="结束集">
          <button class="tb" data-act="range">区间</button>
        </div>
        <span class="count" id="dCount">已选 0 集</span>
      </div>
      <div class="eps" id="dEps"></div>
    </div>
    <div class="sheet-foot">
      <div class="sel">已选 <b id="dSelN">0</b> 集 · <span id="dSize">—</span></div>
      <select class="q" id="dQuality">
        <option value="best">高清优先</option>
        <option value="saver">省流量</option>
      </select>
      <button class="big" id="dDownload" disabled>开始下载</button>
      <div class="adv">
        <div class="grp"><span>同时下载</span><input type="range" id="dEpConc" min="1" max="4" step="1" value="2"><span><b id="dEpConcN">2</b> 集</span></div>
        <div class="grp"><span>分片并发</span><input type="range" id="dSegConc" min="2" max="24" step="2" value="8"><span><b id="dSegConcN">8</b></span></div>
        <div class="grp sw"><span>剔除广告</span><label class="tg"><input type="checkbox" id="dStripAds" checked><i></i></label></div>
      </div>
    </div>
  </div>
</div>

<div class="dialog" id="dialog" hidden>
  <div class="mask"></div>
  <div class="box">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="row">
      <button id="dlgCancel">取消</button>
      <button id="dlgOk" class="ok">确定</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 基础
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtSize(n) {
    if (!n) return '0 B';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(i ? 1 : 0) + ' ' + u[i];
  }
  function fmtSpeed(n) { return n > 0 ? fmtSize(n) + '/s' : '—'; }
  function fmtEta(s) {
    if (!s || s <= 0 || s > 86400) return '';
    var m = Math.floor(s / 60), ss = s % 60;
    if (m >= 60) return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
    if (m > 0) return m + ' 分 ' + ss + ' 秒';
    return ss + ' 秒';
  }
  function fmtDur(s) {
    s = Math.round(s || 0);
    if (s <= 0) return '0 秒';
    if (s < 120) return s + ' 秒';
    var m = Math.floor(s / 60), ss = s % 60;
    if (m >= 60) return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
    return m + ' 分' + (ss ? ' ' + ss + ' 秒' : '');
  }

  async function api(url, opts) {
    var r = await fetch(url, opts);
    var d = null;
    try { d = await r.json(); } catch (e) { d = {}; }
    if (!r.ok) throw new Error((d && d.error) || ('请求失败 ' + r.status));
    return d;
  }

  // ---------------------------------------------------------------- Toast / 对话框
  function toast(msg, type, ms) {
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.innerHTML = (type === 'ok' ? '✓ ' : type === 'err' || type === 'warn' ? '! ' : '') + esc(msg);
    $('#toasts').appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 220);
    }, ms || 2400);
  }

  var dlgResolve = null;
  function confirmBox(opt) {
    return new Promise(function (resolve) {
      $('#dlgTitle').textContent = opt.title || '确认';
      $('#dlgText').textContent = opt.text || '';
      var ok = $('#dlgOk');
      ok.textContent = opt.ok || '确定';
      ok.className = opt.danger ? 'dan' : 'ok';
      $('#dialog').hidden = false;
      dlgResolve = resolve;
    });
  }
  function closeDlg(v) {
    $('#dialog').hidden = true;
    if (dlgResolve) { var f = dlgResolve; dlgResolve = null; f(v); }
  }
  $('#dlgCancel').onclick = function () { closeDlg(false); };
  $('#dlgOk').onclick = function () { closeDlg(true); };
  $('#dialog .mask').onclick = function () { closeDlg(false); };

  // ---------------------------------------------------------------- 主题
  var theme = LS.get('theme', '');
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  $('#btnTheme').onclick = function () {
    var cur = document.documentElement.getAttribute('data-theme');
    if (!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    LS.set('theme', next);
  };

  // ---------------------------------------------------------------- 状态
  var S = {
    view: 'search',
    detail: null,
    pid: null,
    sel: {},
    jobs: [],
    jobFilter: 'active',
    expanded: {},
    done: {},
    detailVid: null,
    loadingDetail: false
  };

  // ---------------------------------------------------------------- 视图切换
  function setView(v) {
    S.view = v;
    $('#view-search').hidden = v !== 'search';
    $('#view-jobs').hidden = v !== 'jobs';
    $$('.tabbar button').forEach(function (b) { b.classList.toggle('on', b.dataset.view === v); });
    window.scrollTo(0, 0);
  }
  $$('.tabbar button').forEach(function (b) {
    b.onclick = function () { setView(b.dataset.view); };
  });

  // ---------------------------------------------------------------- 搜索
  var HOT = ['爱你', '凡人修仙传', '庆余年', '甄嬛传', '狂飙', '三体'];
  var searchSeq = 0;

  function renderChips() {
    var recent = LS.get('recent', []);
    var list = recent.concat(HOT).filter(function (v, i, a) { return a.indexOf(v) === i; }).slice(0, 8);
    $('#chips').innerHTML = list.map(function (k) {
      return '<button class="chip" data-kw="' + esc(k) + '">' + esc(k) + '</button>';
    }).join('');
    $$('#chips .chip').forEach(function (c) {
      c.onclick = function () { $('#kw').value = c.dataset.kw; doSearch(); };
    });
  }

  function pushRecent(kw) {
    var r = LS.get('recent', []);
    r = [kw].concat(r.filter(function (x) { return x !== kw; })).slice(0, 6);
    LS.set('recent', r);
    renderChips();
  }

  function skeleton(n) {
    var h = '';
    for (var i = 0; i < n; i++) {
      h += '<div class="sk-card"><div class="a sk"></div><div class="b sk"></div><div class="c sk"></div></div>';
    }
    $('#results').innerHTML = h;
  }

  function emptyState(icon, title, sub, retry) {
    $('#results').innerHTML =
      '<div class="empty" style="grid-column:1/-1"><div class="ic">' + icon + '</div><b>' + esc(title) + '</b><p>' + esc(sub) + '</p>' +
      (retry ? '<p style="margin-top:14px"><button class="tb" id="btnRetry">重新搜索</button></p>' : '') + '</div>';
    if (retry) $('#btnRetry').onclick = doSearch;
  }

  function imgUrl(u) {
    if (!u) return '';
    return '/api/img?u=' + encodeURIComponent(u);
  }

  async function doSearch() {
    var kw = $('#kw').value.trim();
    if (!kw) { $('#kw').focus(); return; }
    var seq = ++searchSeq;
    $('#btnSearch').disabled = true;
    $('#searchHint').className = 'hint';
    $('#searchHint').innerHTML = '<span class="spin"></span> 正在搜索…';
    skeleton(8);
    pushRecent(kw);

    try {
      var d = await api('/api/search?kw=' + encodeURIComponent(kw));
      if (seq !== searchSeq) return;
      var list = d.results || [];
      $('#searchHint').textContent = list.length
        ? '找到 ' + list.length + ' 个结果' + (d.stale ? '（离线缓存）' : '')
        : '';
      if (!list.length) {
        emptyState('🔍', '没有找到「' + kw + '」', '换个关键词试试，或用更短的剧名。', true);
        return;
      }
      $('#results').innerHTML = list.map(function (it) {
        return '<button class="card" data-vid="' + esc(it.vid) + '">' +
          '<div class="ph">' +
          (it.pic ? '<img loading="lazy" src="' + esc(imgUrl(it.pic)) + '" alt="">' : '<div class="fb">🎬</div>') +
          (it.note ? '<span class="tag">' + esc(it.note) + '</span>' : '') +
          '</div>' +
          '<div class="body"><div class="t">' + esc(it.title) + '</div>' +
          (it.actors ? '<div class="s">' + esc(it.actors) + '</div>' : '') +
          '</div></button>';
      }).join('');

      $$('#results img').forEach(function (im) {
        function done() { im.classList.add('loaded'); }
        function fail() {
          var ph = im.parentNode;
          if (!ph) return;
          im.remove();
          if (!ph.querySelector('.fb')) {
            var fb = document.createElement('div');
            fb.className = 'fb';
            fb.textContent = '🎬';
            ph.appendChild(fb);
          }
        }
        // 图片可能已从缓存加载完成，回调绑定时 load 事件已经过去了
        if (im.complete && im.naturalWidth > 0) done();
        im.addEventListener('load', done);
        im.addEventListener('error', fail);
      });
      $$('#results .card').forEach(function (c) {
        c.onclick = function () { openDetail(c.dataset.vid); };
      });
    } catch (e) {
      if (seq !== searchSeq) return;
      $('#searchHint').className = 'hint err';
      $('#searchHint').textContent = e.message;
      emptyState('📡', '搜索失败', e.message + '。网络不稳时可稍后重试，已缓存过的内容仍可查看。', true);
    } finally {
      if (seq === searchSeq) $('#btnSearch').disabled = false;
    }
  }

  $('#searchForm').onsubmit = function (e) { e.preventDefault(); doSearch(); };
  $('#kw').oninput = function () { $('#btnClear').hidden = !this.value; };
  $('#btnClear').onclick = function () {
    $('#kw').value = '';
    $('#btnClear').hidden = true;
    $('#kw').focus();
  };

  // ---------------------------------------------------------------- 详情
  function openSheet() {
    var s = $('#sheet');
    s.hidden = false;
    requestAnimationFrame(function () { s.classList.add('open'); });
    document.body.style.overflow = 'hidden';
    // 详情面板打开时，底部被面板占住，提示条改到顶部显示
    $('#toasts').classList.add('sheet');
  }
  function closeSheet() {
    var s = $('#sheet');
    s.classList.remove('open');
    document.body.style.overflow = '';
    $('#toasts').classList.remove('sheet');
    setTimeout(function () { s.hidden = true; }, 260);
  }
  $$('#sheet [data-close]').forEach(function (b) { b.onclick = closeSheet; });

  function metaChips(meta, groups) {
    var out = [];
    if (meta['状态']) out.push('<span class="pill ok">' + esc(meta['状态']) + '</span>');
    if (meta['年代']) out.push('<span class="pill">' + esc(meta['年代']) + '</span>');
    if (meta['地区']) out.push('<span class="pill">' + esc(meta['地区']) + '</span>');
    if (meta['类型']) out.push('<span class="pill a">' + esc(meta['类型']) + '</span>');
    var eps = groups && groups[0] ? groups[0].episodes.length : 0;
    if (eps) out.push('<span class="pill">共 ' + eps + ' 集</span>');
    return out.join('');
  }

  async function openDetail(vid) {
    S.detailVid = vid;
    S.detail = null;
    S.pid = null;
    S.sel = {};
    S.loadingDetail = true;
    $('#dTitle').textContent = '加载中…';
    $('#dMeta').innerHTML = '';
    $('#dPic').removeAttribute('src');
    $('#dDesc').hidden = true;
    $('#dMore').hidden = true;
    $('#dLines').innerHTML = '';
    $('#dEps').innerHTML = '<div class="sk" style="height:80px;border-radius:12px;grid-column:1/-1"></div>';
    updateFoot();
    openSheet();

    try {
      var d = await api('/api/detail?vid=' + encodeURIComponent(vid));
      if (S.detailVid !== vid) return;
      S.detail = d;
      S.pid = d.groups && d.groups.length ? d.groups[0].pid : null;
      $('#dTitle').textContent = d.title || '未命名';
      $('#dMeta').innerHTML = metaChips(d.meta || {}, d.groups);
      if (d.pic) {
        $('#dPic').src = imgUrl(d.pic);
        $('#dPic').onerror = function () { this.style.visibility = 'hidden'; };
      }
      var desc = (d.meta && d.meta['剧情']) || '';
      if (desc) {
        $('#dDesc').hidden = false;
        $('#dDesc').textContent = desc;
        if (desc.length > 80) {
          $('#dMore').hidden = false;
          $('#dMore').textContent = '展开简介';
        }
      }
      renderLines();
      renderEps();
    } catch (e) {
      $('#dTitle').textContent = '加载失败';
      $('#dMeta').innerHTML = '<span class="pill" style="color:var(--danger)">' + esc(e.message) + '</span>';
      $('#dEps').innerHTML = '<div class="empty" style="grid-column:1/-1"><b>无法加载剧集</b><p>' + esc(e.message) + '</p></div>';
    } finally {
      S.loadingDetail = false;
    }
  }

  $('#dMore').onclick = function () {
    var d = $('#dDesc');
    var open = d.classList.toggle('open');
    this.textContent = open ? '收起简介' : '展开简介';
  };

  function renderLines() {
    var gs = (S.detail && S.detail.groups) || [];
    $('#dLines').innerHTML = gs.map(function (g) {
      return '<button class="line' + (g.pid === S.pid ? ' on' : '') + '" data-pid="' + g.pid + '">' +
        esc(g.name) + ' · ' + g.episodes.length + '集</button>';
    }).join('');
    $$('#dLines .line').forEach(function (b) {
      b.onclick = function () {
        S.pid = parseInt(b.dataset.pid, 10);
        renderLines();
        renderEps();
      };
    });
  }

  function curGroup() {
    var gs = (S.detail && S.detail.groups) || [];
    for (var i = 0; i < gs.length; i++) if (gs[i].pid === S.pid) return gs[i];
    return gs[0] || null;
  }
  function key(pid, epid) { return pid + '-' + epid; }

  function renderEps() {
    var g = curGroup();
    if (!g) { $('#dEps').innerHTML = '<div class="empty" style="grid-column:1/-1"><b>没有可用分集</b></div>'; return; }
    var vid = S.detail.vid;
    $('#dEps').innerHTML = g.episodes.map(function (ep) {
      var k = key(g.pid, ep.epid);
      var on = !!S.sel[k];
      var done = !!S.done[vid + '-' + k];
      return '<button class="ep' + (on ? ' on' : '') + '" data-k="' + k + '">' + esc(ep.name) +
        (done ? '<span class="d"></span>' : '') + '</button>';
    }).join('');
    $$('#dEps .ep').forEach(function (el) {
      el.onclick = function () {
        var k = el.dataset.k;
        if (S.sel[k]) delete S.sel[k]; else S.sel[k] = 1;
        el.classList.toggle('on');
        updateFoot();
      };
    });
    updateFoot();
  }

  function updateFoot() {
    var g = curGroup();
    var n = 0;
    if (g) g.episodes.forEach(function (ep) { if (S.sel[key(g.pid, ep.epid)]) n++; });
    $('#dCount').textContent = '已选 ' + n + ' 集';
    $('#dSelN').textContent = n;
    $('#dDownload').disabled = n === 0 || S.loadingDetail;
    // 估算体积：按 2Mbps × 45 分钟 ≈ 650MB 粗估
    $('#dSize').textContent = n ? '约 ' + fmtSize(n * 420 * 1024 * 1024) : '—';
  }

  $$('#sheet .toolbar .tb').forEach(function (b) {
    b.onclick = function () {
      var g = curGroup();
      if (!g) return;
      var act = b.dataset.act;
      var vid = S.detail.vid;
      if (act === 'all') g.episodes.forEach(function (e) { S.sel[key(g.pid, e.epid)] = 1; });
      if (act === 'none') S.sel = {};
      if (act === 'invert') g.episodes.forEach(function (e) {
        var k = key(g.pid, e.epid);
        if (S.sel[k]) delete S.sel[k]; else S.sel[k] = 1;
      });
      if (act === 'undone') {
        S.sel = {};
        g.episodes.forEach(function (e) {
          if (!S.done[vid + '-' + key(g.pid, e.epid)]) S.sel[key(g.pid, e.epid)] = 1;
        });
      }
      if (act === 'range') {
        var a = parseInt($('#rFrom').value, 10) || 1;
        var z = parseInt($('#rTo').value, 10) || 1;
        if (a > z) { var t = a; a = z; z = t; }
        g.episodes.forEach(function (e) {
          var no = e.epid + 1;
          if (no >= a && no <= z) S.sel[key(g.pid, e.epid)] = 1;
        });
      }
      renderEps();
    };
  });

  $('#dEpConc').oninput = function () { $('#dEpConcN').textContent = this.value; LS.set('epConc', +this.value); };
  $('#dSegConc').oninput = function () { $('#dSegConcN').textContent = this.value; LS.set('segConc', +this.value); };
  $('#dQuality').onchange = function () { LS.set('quality', this.value); };
  $('#dStripAds').onchange = function () {
    LS.set('stripAds', this.checked);
    if (!this.checked) toast('已关闭广告剔除，插播广告会保留在文件里', 'warn');
  };

  $('#dDownload').onclick = async function () {
    var g = curGroup();
    if (!g || !S.detail) return;
    var items = [];
    g.episodes.forEach(function (ep) {
      if (S.sel[key(g.pid, ep.epid)]) {
        items.push({ vid: S.detail.vid, pid: g.pid, epid: ep.epid, name: ep.name });
      }
    });
    if (!items.length) return;
    if (items.length > 20) {
      var okBig = await confirmBox({
        title: '确认下载 ' + items.length + ' 集？',
        text: '预计占用约 ' + fmtSize(items.length * 420 * 1024 * 1024) + ' 空间，建议分批下载以免占满存储。',
        ok: '继续下载'
      });
      if (!okBig) return;
    }
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> 提交中';
    try {
      var d = await api('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: S.detail.title,
          vid: S.detail.vid,
          pic: S.detail.pic,
          items: items,
          quality: $('#dQuality').value,
          episodeConcurrency: parseInt($('#dEpConc').value, 10),
          segmentConcurrency: parseInt($('#dSegConc').value, 10),
          stripAds: $('#dStripAds').checked
        })
      });
      var st = d.job ? d.job.status : '';
      if (st === 'done' || st === 'error') {
        toast(st === 'done' ? '这些分集已下载过，直接跳过' : '任务已结束，请到「全部」查看', 'ok');
      } else {
        toast('已加入下载队列：' + items.length + ' 集', 'ok');
      }
      closeSheet();
      setView('jobs');
      // 已完成的旧任务不会出现在「进行中」，直接切到「全部」
      switchJobFilter(st === 'done' || st === 'error' ? 'all' : 'active');
      if (d.job) upsertJobs([d.job]);
    } catch (e) {
      toast('提交失败：' + e.message, 'err', 3200);
    } finally {
      btn.disabled = false;
      btn.textContent = '开始下载';
      updateFoot();
    }
  };

  // ---------------------------------------------------------------- 任务渲染
  var jobNodes = {};

  function statusInfo(j) {
    if (j.status === 'running') return { cls: 'run', text: '下载中' };
    if (j.status === 'done') return { cls: 'done', text: '已完成' };
    if (j.status === 'paused') return { cls: 'pause', text: '已暂停' };
    if (j.status === 'cancelled') return { cls: 'idle', text: '已取消' };
    if (j.status === 'error') return { cls: 'err', text: '有失败' };
    if (j.status === 'queued') return { cls: 'idle', text: '排队中' };
    return { cls: 'idle', text: j.status };
  }

  var FSTATUS = {
    pending: '排队', resolving: '解析', downloading: '下载中', done: '完成',
    skipped: '已存在', error: '失败', cancelled: '已取消', paused: '已暂停'
  };

  function jobEl(j) {
    var el = document.createElement('div');
    el.className = 'job';
    el.dataset.id = j.id;
    el.innerHTML =
      '<div class="jh"><div class="jt"><b></b><small></small></div><span class="st"></span></div>' +
      '<div class="prog"><i></i></div>' +
      '<div class="stat"></div>' +
      '<div class="acts"></div>' +
      '<div class="files"></div>';
    return el;
  }

  function renderJob(el, j) {
    var st = statusInfo(j);
    $('.jt b', el).textContent = j.title;
    $('.jt small', el).textContent = j.stats.finished + '/' + j.stats.count + ' 集 · ' + j.stats.percent + '% · ' + fmtSize(j.stats.bytes) +
      (j.stats.speed ? ' · ' + fmtSpeed(j.stats.speed) : '') +
      (j.stats.eta ? ' · 剩 ' + fmtEta(j.stats.eta) : '') +
      (j.stats.adsBlocks ? ' · 已去广告 ' + j.stats.adsBlocks + ' 段 ' + fmtDur(j.stats.adsSeconds) : '');
    var pill = $('.st', el);
    pill.className = 'st ' + st.cls;
    pill.textContent = st.text;

    var prog = $('.prog', el);
    prog.className = 'prog' + (j.status === 'done' ? ' done' : j.status === 'error' ? ' err' : j.status === 'paused' ? ' pause' : '');
    $('.prog i', el).style.width = Math.max(2, j.stats.percent) + '%';

    var running = j.status === 'running';
    var canRetry = (j.status === 'error' || j.status === 'paused' || j.status === 'cancelled') &&
      j.files.some(function (f) { return f.status === 'error' || f.status === 'paused' || f.status === 'cancelled' || f.status === 'pending'; });

    var acts = '';
    if (running) acts += '<button class="act" data-a="pause">暂停</button>';
    if (j.status === 'paused') acts += '<button class="act pri" data-a="resume">继续</button>';
    if (running || j.status === 'paused') acts += '<button class="act dan" data-a="cancel">取消</button>';
    if (canRetry && j.status !== 'paused') acts += '<button class="act pri" data-a="retry">重试失败</button>';
    acts += '<button class="act" data-a="files">' + (S.expanded[j.id] ? '收起明细' : '查看明细') + '</button>';
    acts += '<button class="act dan" data-a="delete">删除任务</button>';
    $('.acts', el).innerHTML = acts;

    $$('.acts .act', el).forEach(function (b) {
      b.onclick = function () { jobAction(j, b.dataset.a, b); };
    });

    // 文件列表（仅在展开时渲染，避免无谓开销）
    var box = $('.files', el);
    box.classList.toggle('open', !!S.expanded[j.id]);
    if (S.expanded[j.id]) renderFiles(box, j);
  }

  function renderFiles(box, j) {
    box.innerHTML = j.files.map(function (f) {
      var pct = f.total ? Math.round((f.done / f.total) * 100) : (f.status === 'done' || f.status === 'skipped' ? 100 : 0);
      var cls = (f.status === 'done' || f.status === 'skipped') ? 'done' : f.status === 'error' ? 'err' : '';
      var txt = f.status === 'downloading'
        ? (f.total ? (f.done + '/' + f.total + ' · ' + fmtSpeed(f.speed)) : '准备中…')
        : (FSTATUS[f.status] || f.status) + (f.bytes ? ' · ' + fmtSize(f.bytes) : '');
      var go = (f.status === 'done' && f.hasFile)
        ? '<button class="fgo" data-save="' + f.idx + '">保存</button>'
        : (f.error ? '<span class="ferr" title="' + esc(f.error) + '">!</span>' : '');
      var adTag = (f.ads && f.ads.ranges)
        ? '<span class="fad" title="已剔除 ' + f.ads.ranges + ' 段广告，共 ' + fmtDur(f.ads.seconds) + '">去广告</span>'
        : '';
      return '<div class="f"><span class="fn">' + esc(f.name) + '</span>' + adTag +
        '<div class="fb"><i class="' + cls + '" style="width:' + pct + '%"></i></div>' +
        '<span class="fs">' + esc(txt) + '</span>' + go + '</div>';
    }).join('');
    $$('[data-save]', box).forEach(function (b) {
      b.onclick = function () { saveFile(j, j.files[+b.dataset.save], b); };
    });
  }

  async function saveFile(j, f, btn) {
    var url = '/api/file/' + j.id + '/' + f.idx;
    var name = j.title + '_' + f.name + '.ts';
    if (window.VodApp && window.VodApp.save) {
      try {
        btn.disabled = true;
        btn.textContent = '保存中';
        window.VodApp.save(url, name);
        setTimeout(function () { btn.disabled = false; btn.textContent = '保存'; }, 1200);
        return;
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '保存';
      }
    }
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function jobAction(j, a, btn) {
    if (a === 'files') {
      S.expanded[j.id] = !S.expanded[j.id];
      var el = jobNodes[j.id];
      if (el) renderJob(el, j);
      return;
    }
    if (a === 'delete') {
      var ok = await confirmBox({
        title: '删除任务',
        text: '仅从列表移除，已下载的文件会保留。是否同时删除已下载的文件？',
        ok: '删除任务和文件',
        danger: true
      });
      try {
        await api('/api/job/' + j.id + '?files=' + (ok ? '1' : '0'), { method: 'DELETE' });
        delete jobNodes[j.id];
        toast(ok ? '任务和文件已删除' : '任务已移除');
        switchJobFilter('all');
        refreshJobs();
      } catch (e) { toast('删除失败：' + e.message, 'err'); }
      return;
    }
    if (a === 'cancel') {
      var c = await confirmBox({ title: '取消下载', text: '已下载的部分会保留，之后可以继续。', ok: '取消下载', danger: true });
      if (!c) return;
    }
    btn.disabled = true;
    try {
      await api('/api/job/' + j.id + '/' + a, { method: 'POST' });
      if (a === 'cancel') switchJobFilter('all');
      refreshJobs();
    } catch (e) {
      toast('操作失败：' + e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  function upsertJobs(list) {
    var wrap = $('#jobs');
    if (list.length) {
      var emp = wrap.querySelector('.empty');
      if (emp) emp.remove();
    }
    var keep = {};
    list.forEach(function (j) {
      keep[j.id] = 1;
      var el = jobNodes[j.id];
      if (!el) {
        el = jobEl(j);
        jobNodes[j.id] = el;
        wrap.appendChild(el);
      }
      renderJob(el, j);
    });
    // 保持与数据一致的顺序（新任务在最前）
    list.forEach(function (j) {
      if (jobNodes[j.id]) wrap.appendChild(jobNodes[j.id]);
    });
    Object.keys(jobNodes).forEach(function (id) {
      if (!keep[id]) {
        jobNodes[id].remove();
        delete jobNodes[id];
      }
    });
  }

  function renderJobs(list) {
    S.jobs = list;
    // 已下载索引（详情页打绿点）
    S.done = {};
    list.forEach(function (j) {
      j.files.forEach(function (f) {
        if (f.status === 'done' || f.status === 'skipped') S.done[(j.vid || '') + '-' + f.pid + '-' + f.epid] = 1;
      });
    });

    var active = list.filter(function (j) { return j.status === 'running' || j.status === 'queued' || j.status === 'paused'; });
    var shown = S.jobFilter === 'active' ? active : list;

    var badge = $('#jobBadge');
    if (active.length) {
      badge.hidden = false;
      badge.textContent = active.length;
    } else badge.hidden = true;

    if (!shown.length) {
      var hasOther = S.jobFilter === 'active' && list.length > 0;
      $('#jobs').innerHTML = '<div class="empty"><div class="ic">📥</div><b>' +
        (hasOther ? '没有进行中的任务' : (S.jobFilter === 'active' ? '当前没有进行中的任务' : '还没有下载任务')) +
        '</b><p>' + (hasOther ? '历史任务都在「全部」里。' : '去「搜索」里找剧，勾选分集后就能开始下载。') +
        (hasOther ? '<br><button class="tb" id="btnAllJobs" style="margin-top:12px">查看全部任务</button>' : '') +
        '</p></div>';
      jobNodes = {};
      var bj = $('#btnAllJobs');
      if (bj) bj.onclick = function () { switchJobFilter('all'); };
      return;
    }
    if ($('#jobs .empty')) $('#jobs').innerHTML = '';
    upsertJobs(shown);
  }

  function switchJobFilter(f) {
    S.jobFilter = f;
    $$('#jobSeg button').forEach(function (x) { x.classList.toggle('on', x.dataset.f === f); });
    renderJobs(S.jobs);
  }
  $$('#jobSeg button').forEach(function (b) {
    b.onclick = function () { switchJobFilter(b.dataset.f); };
  });

  async function refreshJobs() {
    try {
      var d = await api('/api/jobs');
      renderJobs(d.jobs || []);
    } catch (e) { /* 静默 */ }
  }

  // ---------------------------------------------------------------- 实时推送
  var es = null, pollTimer = null, esFails = 0;

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(refreshJobs, 2000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function connectSSE() {
    if (!window.EventSource) { startPolling(); return; }
    try { es = new EventSource('/api/events'); } catch (e) { startPolling(); return; }
    es.addEventListener('jobs', function (ev) {
      esFails = 0;
      stopPolling();
      try {
        var d = JSON.parse(ev.data);
        renderJobs(d.jobs || []);
        setOnline(true);
      } catch (e) {}
    });
    es.onopen = function () { esFails = 0; setOnline(true); };
    es.onerror = function () {
      esFails++;
      setOnline(false);
      if (esFails >= 3) {
        try { es.close(); } catch (e) {}
        es = null;
        startPolling();
      }
    };
  }

  function setOnline(ok) {
    var t = $('#statusText');
    t.innerHTML = '<span class="dot' + (ok ? '' : ' off') + '"></span>' + (ok ? '本地服务已连接' : '连接中断，重试中');
  }

  // ---------------------------------------------------------------- 启动
  (async function init() {
    // 恢复偏好
    var q = LS.get('quality', 'best');
    $('#dQuality').value = q;
    var ec = LS.get('epConc', 2);
    var sc = LS.get('segConc', 8);
    $('#dEpConc').value = ec; $('#dEpConcN').textContent = ec;
    $('#dSegConc').value = sc; $('#dSegConcN').textContent = sc;
    $('#dStripAds').checked = LS.get('stripAds', true) !== false;

    renderChips();
    emptyState('🎬', '搜索你想看的剧', '输入剧名开始，支持批量选择分集下载。', false);

    window.addEventListener('scroll', function () {
      $('#top').classList.toggle('scrolled', window.scrollY > 4);
    }, { passive: true });

    try {
      var info = await api('/api/info');
      setOnline(true);
      window.__info = info;
      if (info.defaults) {
        if (!LS.get('epConc', 0)) { $('#dEpConc').value = info.defaults.episodeConcurrency; $('#dEpConcN').textContent = info.defaults.episodeConcurrency; }
        if (!LS.get('segConc', 0)) { $('#dSegConc').value = info.defaults.segmentConcurrency; $('#dSegConcN').textContent = info.defaults.segmentConcurrency; }
        if (LS.get('stripAds', null) === null && typeof info.defaults.stripAds === 'boolean') {
          $('#dStripAds').checked = info.defaults.stripAds;
        }
      }
    } catch (e) {
      setOnline(false);
    }

    await refreshJobs();
    connectSSE();
    if ((S.jobs || []).some(function (j) { return j.status === 'running'; })) setView('jobs');
  })();

  window.addEventListener('error', function (e) {
    if (e && e.message) toast('页面异常：' + e.message, 'err', 3000);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    toast('操作失败：' + ((r && r.message) || r || '未知错误'), 'err', 3000);
  });
})();
</script>
