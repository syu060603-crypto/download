org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------- 体积
# 打包哪些 ABI。libnode.so 每个 ABI 约 25-30MB，是 APK 体积的绝对大头：
#   arm64-v8a   → 现在几乎所有在售安卓机（2018 年后基本都是 64 位）
#   armeabi-v7a → 32 位老设备，加上会多 ~25MB
#   x86_64      → 只有模拟器用，真机不需要
# 默认只留 arm64，APK 约为三个全打时的 1/3。需要兼容老设备时改成：
#   vodAbiFilters=arm64-v8a,armeabi-v7a
vodAbiFilters=arm64-v8a
